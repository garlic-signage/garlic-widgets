<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GarlicFrame</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<iframe id="frame" src="about:blank" allowfullscreen
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation"></iframe>

<div id="idle-overlay" title="Touch to continue">
    <div id="idle-countdown">--</div>
    <div id="idle-message">Tap to continue</div>
    <div id="idle-bar-wrap">
        <div id="idle-bar"></div>
    </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
