<!DOCTYPE html>
<html lang="en">
	<head>
	    <meta charset="UTF-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	    <title>Weather</title>
	    <link rel="stylesheet" href="css/widget.css">
	</head>
	<body>
	    <div id="widget" class="widget">
	        <div class="state-loading">Load data …</div>
	    </div>

	    <!-- Main Widget Template -->
	    <template id="tpl-widget">
	        <header class="widget-header">
	            <span class="location" data-bind="location"></span>
	            <button id="btn-refresh" class="btn-refresh" data-bind-title="refresh">↻</button>
	        </header>

	        <section class="widget-current">
	            <div class="weather-icon">
	                <img data-bind-src="iconSrc"
	                     data-bind-alt="conditionText"
	                     alt="weaather icon"
	                     src="icons/not-available.svg">

	            </div>
	            <div class="temperature">
	                <span data-bind="temperature"></span><span class="unit" data-bind="unitCelsius"></span>
	            </div>
	            <div class="condition-text" data-bind="conditionText"></div>
	        </section>

	        <section class="widget-details">
	            <div class="detail-item">
	                <span class="detail-label" data-bind="feelsLikeLabel"></span>
	                <span class="detail-value" data-bind="feelsLikeValue"></span>
	            </div>
	            <div class="detail-item">
	                <span class="detail-label" data-bind="humidityLabel"></span>
	                <span class="detail-value" data-bind="humidityValue"></span>
	            </div>
	            <div class="detail-item">
	                <span class="detail-label" data-bind="windLabel"></span>
	                <span class="detail-value" data-bind="windValue"></span>
	            </div>
	        </section>

	        <section class="widget-forecast" data-bind-hidden="noForecast">
	            <div class="forecast-label" data-bind="forecastLabel"></div>
	            <div class="forecast-days" data-slot="forecast"></div>
	        </section>

	        <footer class="widget-footer">
	            <span data-bind="lastUpdated"></span>
	            <span class="provider" data-bind="provider"></span>
	        </footer>
	    </template>

	    <!-- Forecast Day Template -->
	    <template id="tpl-forecast-day">
	        <div class="forecast-day">
	            <span class="forecast-weekday" data-bind="dayName"></span>
	            <img class="forecast-icon"
	                 data-bind-src="iconSrc"
	                 data-bind-alt="conditionText"
	                 alt="forecast icon"
	            src="icons/not-available.svg">
	            <span class="forecast-temps">
	                <span class="temp-max" data-bind="tempMax"></span>
	                <span class="temp-min" data-bind="tempMin"></span>
	            </span>
	        </div>
	    </template>

	    <!-- Loading State Template -->
	    <template id="tpl-loading">
	        <div class="state-loading" data-bind="message"></div>
	    </template>

	    <!-- Error State Template -->
	    <template id="tpl-error">
	        <div class="state-error" data-bind="message"></div>
	    </template>

	    <script type="module" src="js/main.js"></script>
	</body>
</html>
